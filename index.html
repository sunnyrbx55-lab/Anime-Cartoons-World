<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Browse cartoons and cartoon movies, rate titles and download authorized content.">
<title>Vamshi Anime World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--s:#12121c;--s2:#1b1b2b;--t:#f2f2f8;--m:#9a9ab5;--a:#8b5cf6;--b:#f43f5e;--g:linear-gradient(120deg,#8b5cf6,#f43f5e)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:radial-gradient(900px 500px at 85% -10%,#2a1457,transparent),var(--bg);color:var(--t);font:15px/1.5 'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px;border-radius:8px}
img{display:block}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;transition:opacity .5s}
#loader.off{opacity:0;pointer-events:none}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #2a2a40;border-top-color:var(--a);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* nav */
#nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,4vw,40px);background:rgba(7,7,13,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}
.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo img{height:30px}
#links{display:flex;gap:2px;align-items:center}
#links a{padding:8px 11px;border-radius:10px;color:var(--m);font-weight:600;font-size:14px;transition:.2s}
#links a:hover{color:#fff;background:#ffffff14}
.adm{background:var(--g);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 6px 22px #8b5cf655;transition:.25s;margin-left:6px}
.adm:hover{transform:translateY(-2px)}
#burger{display:none;font-size:24px;padding:2px 10px}
@media(max-width:1000px){#burger{display:block}#links{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;padding:12px;background:#0c0c16f5;transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}#links.open{transform:none;opacity:1;pointer-events:auto}.adm{margin:6px 0 0}}
/* buttons */
.btn{padding:11px 20px;border-radius:12px;font-weight:700;transition:.25s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.p{background:var(--g);box-shadow:0 8px 26px #8b5cf655}
.btn.p:hover{transform:translateY(-2px);box-shadow:0 12px 32px #f43f5e55}
.btn.g{background:#ffffff14;border:1px solid #ffffff1f}
.btn.g:hover{background:#ffffff26}
.btn.d{background:#f43f5e22;color:#fda4af;border:1px solid #f43f5e55}
.btn.d:hover{background:#f43f5e44}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
/* announcement + hero */
.ann{background:var(--g);text-align:center;padding:9px 14px;font-weight:600;font-size:14px}
.hero{position:relative;min-height:min(78vh,620px);display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 20s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.08)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,#07070d99 45%,#07070d33),linear-gradient(90deg,#07070dd0,transparent 70%)}
.hc{position:relative;z-index:2;display:flex;gap:28px;align-items:flex-end;padding:90px clamp(14px,4vw,40px) 40px;width:100%;max-width:1400px;margin:auto}
.hp{width:190px;border-radius:18px;box-shadow:0 20px 60px #000a;aspect-ratio:2/3;object-fit:cover;transform:perspective(800px) rotateY(9deg);transition:.4s;flex:none}
.hp:hover{transform:none}
.hero h1{font-size:clamp(30px,6vw,60px);line-height:1.05;font-weight:800;margin:10px 0}
.tag{background:#ffffff1a;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;backdrop-filter:blur(8px)}
.d{max-width:620px;color:#d0d0e4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 16px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:700px){.hp{display:none}}
.m{color:var(--m);font-size:13.5px}
/* sections */
.wrap{max-width:1400px;margin:auto;padding:0 clamp(14px,4vw,40px)}
section.s{margin:38px 0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sh h2{font-size:clamp(20px,3vw,28px);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1150px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{cursor:pointer;transition:.3s;border-radius:16px;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card:hover{transform:translateY(-6px)}
.pz{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:2/3;background:var(--s2);box-shadow:0 8px 24px #0008;transition:.3s}
.card:hover .pz{box-shadow:0 14px 40px #8b5cf666}
.pz img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .pz img{transform:scale(1.08)}
.b{position:absolute;top:8px;left:8px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800;background:var(--g)}
.b.ty{left:auto;right:8px;background:#000a;backdrop-filter:blur(6px)}
.cdchip{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;padding:6px;border-radius:10px;background:#000b;backdrop-filter:blur(8px);font-size:12px;font-weight:700;border:1px solid #8b5cf688}
.card h3{font-size:15px;margin:9px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:#fbbf24;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:36px 14px;color:var(--m);border:1px dashed #ffffff22;border-radius:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:99px;background:#ffffff10;border:1px solid #ffffff1a;font-weight:600;transition:.2s}
.chip:hover{background:var(--a)}
.chip small{color:var(--m);margin-left:4px}
.bar{display:flex;gap:10px;align-items:center;font-size:13px}
.bar span:first-child{width:36px}.bar span:last-child{width:38px;text-align:right;color:var(--m)}
.bar i{flex:1;height:8px;border-radius:9px;background:#ffffff14;overflow:hidden}
.bar u{display:block;height:100%;background:var(--g);transition:width .6s}
/* browse */
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.filters #q{grid-column:1/-1}
@media(min-width:800px){.filters{grid-template-columns:2fr repeat(4,1fr)}.filters #q{grid-column:auto}}
input,select,textarea{background:var(--s2);border:1px solid #ffffff1c;border-radius:12px;padding:11px 14px;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #8b5cf633;outline:0}
select option{background:#1b1b2b}
/* countdown */
.cdw{margin:14px 0;padding:14px;border-radius:16px;background:#ffffff0d;border:1px solid #8b5cf666;backdrop-filter:blur(10px);display:inline-block;max-width:100%}
.cdw>span{font-weight:800;font-size:13px;letter-spacing:.04em}
.cdbig{display:flex;gap:10px;margin:8px 0}
.cdbig div{min-width:64px;text-align:center;padding:10px 6px;border-radius:12px;background:#000a;border:1px solid #ffffff1a}
.cdbig b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.cdbig small{color:var(--m);font-size:11px}
.pill{padding:4px 10px;border-radius:99px;background:#8b5cf633;font-weight:700;font-size:13px;white-space:nowrap}
.lock{padding:12px 14px;border-radius:12px;background:#8b5cf61a;border:1px dashed #8b5cf6aa;margin-bottom:10px;font-weight:600}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px;animation:fi .25s}
#gate{z-index:70}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.panel,.gbox{position:relative;background:var(--s);border:1px solid #ffffff18;border-radius:22px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.panel{width:min(960px,100%);max-height:92vh;overflow:auto}
.gbox{width:min(380px,100%);padding:28px;text-align:center;display:grid;gap:14px}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.x{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;background:#000a;border:1px solid #ffffff2a;transition:.2s}
.x:hover{background:var(--b);transform:rotate(90deg)}
.err{color:#fda4af;min-height:20px;font-weight:600}
.mbd{height:210px;position:relative}
.mbd img{width:100%;height:100%;object-fit:cover}
.mbd:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--s),transparent)}
.mbody{display:flex;gap:22px;padding:0 24px 18px;margin-top:-90px;position:relative}
.mbody h2{font-size:clamp(24px,4vw,36px);line-height:1.1;margin-bottom:8px}
.mp{width:170px;aspect-ratio:2/3;object-fit:cover;border-radius:16px;box-shadow:0 14px 40px #000a;flex:none}
@media(max-width:640px){.mbody{flex-direction:column}.mp{width:120px}}
.chips span{padding:3px 11px;border-radius:99px;background:#ffffff14;font-size:12.5px}
.box{margin:0 24px 18px;padding:18px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12}
.box h3{margin-bottom:10px}
.panel>.box:last-child{margin-bottom:24px}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.stars button{font-size:36px;color:#3a3a55;line-height:1;transition:.15s}
.stars button:hover,.stars button:hover~button,.stars button.on{color:#fbbf24}
.stars button:hover{transform:scale(1.15)}
.stars button:disabled{cursor:default;transform:none}
.se{border:1px solid #ffffff14;border-radius:14px;margin-bottom:10px;overflow:hidden;background:#ffffff06}
.se summary{padding:13px 16px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.se summary small{color:var(--m);font-weight:400}
.ep,.dl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #ffffff10;flex-wrap:wrap;transition:.2s}
.ep:hover,.dl:hover{background:#ffffff0a}
.q{color:#c4b5fd;font-size:13px;font-weight:600}
.pad{padding:12px 16px}
.dl{border:1px solid #ffffff12;border-radius:12px;margin-bottom:8px}
/* admin */
#admin{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;animation:fi .25s}
.ahead{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#0d0d18ee;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14}
.ahead .x{position:static;margin-left:auto;flex:none}
#atabs{display:flex;gap:6px;overflow-x:auto;flex:1}
.at{padding:8px 13px;border-radius:10px;white-space:nowrap;font-weight:600;color:var(--m)}
.at.on{background:var(--g);color:#fff}
#abody{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px}
#abody .box{margin:0}
.legal{padding:12px 16px;border-radius:12px;background:#fbbf2418;border:1px solid #fbbf2455;color:#fde68a;font-weight:600;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sc{padding:18px;border-radius:18px;background:var(--s);border:1px solid #ffffff12;transition:.25s}
.sc:hover{transform:translateY(-4px);border-color:#8b5cf688}
.sc b{display:block;font-size:34px;line-height:1.1;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
.fg label,.inl label{display:grid;gap:5px;font-size:13px;color:var(--m);font-weight:600}
.fg .w{grid-column:1/-1}
.inl{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
@media(max-width:560px){.inl{grid-template-columns:1fr}}
.ck{display:flex!important;grid-template-columns:none;align-items:center;gap:8px!important;color:var(--t)!important}
.ck input{width:18px;height:18px}
.chipc input{display:none}
.chipc span{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffffff10;border:1px solid #ffffff1a;margin:0 6px 6px 0;cursor:pointer;color:var(--t);font-weight:600;transition:.2s}
.chipc input:checked+span{background:var(--g);border-color:transparent}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10;flex-wrap:wrap}
.row img{width:42px;height:60px;object-fit:cover;border-radius:8px}
.gr{flex:1;min-width:160px;display:grid}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rowh h3{margin:0}
.cnt{display:flex;gap:14px;flex-wrap:wrap;color:var(--m);margin:4px 0 10px}
.rrow{padding:10px 0;border-bottom:1px solid #ffffff10}
.ismov .cart,.fg:not(.ismov) .mov{display:none}
h4{margin:16px 0 10px}
/* footer + toast */
footer{margin-top:50px;padding:34px 0;background:#0a0a12;border-top:1px solid #ffffff12}
footer p{white-space:pre-line;color:var(--m);font-size:13px;max-width:900px;margin:10px 0}
footer a{color:#c4b5fd;margin-right:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);z-index:90;background:#1f1f33;border:1px solid #8b5cf6;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;font-weight:600;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="loader" aria-label="Loading"><div class="spin"></div></div>
<header id="nav">
  <a class="logo" href="#" data-nav="home" id="logo"></a>
  <button id="burger" aria-label="Open menu" aria-expanded="false">☰</button>
  <nav id="links" aria-label="Main">
    <a href="#" data-nav="home">Home</a><a href="#" data-nav="cartoon">Cartoons</a><a href="#" data-nav="movie">Cartoon Movies</a>
    <a href="#" data-nav="latest">Latest</a><a href="#" data-nav="trending">Trending</a><a href="#" data-nav="top">Top Rated</a>
    <a href="#" data-nav="cats">Categories</a><a href="#" data-nav="search">Search</a>
    <button class="adm" data-act="adminLogin">🔐 ADMIN PANEL</button>
  </nav>
</header>
<main id="app"></main>
<div id="modal" class="ov" hidden></div>
<div id="gate" class="ov" hidden>
  <form class="gbox" id="gbox" data-form="gate" role="dialog" aria-modal="true" aria-label="Admin code">
    <button type="button" class="x" data-act="closeGate" aria-label="Close">✕</button>
    <h2>🔐 Admin Code</h2>
    <p class="m">Enter the admin code to continue.</p>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Admin code" aria-label="Admin code">
    <p class="err" id="gerr" role="alert"></p>
    <button class="btn p">Open Admin Panel</button>
  </form>
</div>
<div id="admin" hidden>
  <div class="ahead"><b>⚙</b><nav id="atabs" aria-label="Admin sections"></nav><button class="x" data-act="closeAdmin" aria-label="Close admin panel">✕</button></div>
  <div id="abody"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= CONFIG (change the website name here) ================= */
const DEFAULT_NAME='Vamshi Anime World';
const ADMIN_CODE='5349'; // Frontend prototype only: NOT secure. Replace with real backend auth later.
const KEY='vamshiAnimeWorld_v1';
const CLOUD_URL='https://anime-cartoons-world-default-rtdb.firebaseio.com/'; // OPTIONAL live sync: paste your Firebase Realtime Database URL here, e.g. https://your-app-default-rtdb.firebaseio.com
const LANGS=['English','Japanese','Telugu','Hindi','Tamil','Malayalam','Kannada','Bengali','Other'];
const GENRES=['Action','Adventure','Animation','Comedy','Drama','Fantasy','Horror','Kids','Mystery','Romance','Sci-Fi','Superhero','Family','Educational','Other'];
const DISCLAIMER='Copyright Disclaimer\n\nThis website is intended only for content that the website owner has the legal rights, licenses, permissions, or other lawful authorization to distribute.\n\nWe do not support or encourage copyright infringement.\n\nAll trademarks, characters, names, logos, and copyrighted works belong to their respective owners.\n\nDownload buttons may redirect users to third-party file-hosting services such as MediaFire.\n\nIf you believe content is being distributed without authorization, please contact the website administrator.';

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=x=>String(x).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(String(u||'').trim());
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function ph(t,w=400,h=600){let x=0;for(const c of String(t||'?'))x=(x*31+c.charCodeAt(0))%360;
  return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+x+',70%,45%)"/><stop offset="1" stop-color="hsl('+((x+60)%360)+',70%,14%)"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#g)"/><text x="'+w/2+'" y="'+h/2+'" fill="#fff" fill-opacity=".85" font-size="'+Math.round(w/12)+'" font-family="sans-serif" font-weight="700" text-anchor="middle">'+esc(String(t||'').slice(0,20))+'</text></svg>');}
let db,M=null,F={q:'',lang:'',genre:'',year:'',type:''};
const find=id=>db.items.find(i=>i.id===id);
const poster=i=>i.poster||ph(i.title);
const backdrop=i=>i.backdrop||db.settings.hero||ph(i.title,1280,720);
const tot=i=>i.ratings.reduce((a,b)=>a+b,0);
function calculateAverageRating(i){const t=tot(i);return t?i.ratings.reduce((a,c,k)=>a+c*(k+1),0)/t:0}
const isUp=i=>!!i.release&&new Date(i.release)>Date.now();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
function lock(){document.body.style.overflow=(!$('#modal').hidden||!$('#admin').hidden||!$('#gate').hidden)?'hidden':''}

/* ================= DATABASE (localStorage; swap these 2 functions for a real backend later) ================= */
function demo(){
  const n=Date.now(),H=36e5,eT=['The Beginning','Hidden Path','Rising Storm','Final Light'];
  const seas=c=>[1,2].map(s=>({id:uid(),name:'Season '+s,eps:eT.slice(0,c).map((t,i)=>({id:uid(),n:i+1,title:t,desc:'Demo episode. Replace with your own description.',q:'720p',size:'450 MB',url:'https://www.mediafire.com/#DEMO-REPLACE-WITH-YOUR-URL'}))}));
  const base=(o,k)=>Object.assign({id:uid(),created:n-k*H,poster:'',backdrop:'',chars:'',release:'',featured:false,trending:false,ratings:[0,0,0,0,0],seasons:[],dl:[],status:'Ongoing',runtime:''},o);
  const dl=()=>[{q:'720p',size:'1.2 GB',url:'https://www.mediafire.com/#DEMO-720P'},{q:'1080p',size:'2.5 GB',url:'https://www.mediafire.com/#DEMO-1080P'}];
  return{settings:{name:DEFAULT_NAME,desc:'Original cartoons and cartoon movies, shared with permission.',logo:'',hero:'',copy:'',contact:'contact@example.com',social:'Instagram|https://instagram.com\nYouTube|https://youtube.com'},
  ann:{text:'🔥 New Cartoon Episodes Added!',on:true},

function tick(){
  const n=Date.now();let exp=false;
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const ms=new Date(el.dataset.cd)-n;
    if(!(ms>0)){el.removeAttribute('data-cd');exp=true;return}
    const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
    el.innerHTML=el.dataset.big?[[d,'Days'],[h,'Hours'],[m,'Mins'],[c,'Secs']].map(x=>'<div><b>'+p2(x[0])+'</b><small>'+x[1]+'</small></div>').join(''):d+'d '+p2(h)+':'+p2(m)+':'+p2(c);
  });
  if(exp){renderHome();if(M&&!$('#modal').hidden)openItem(M);if(!$('#admin').hidden)adminRender();toast('🎉 A scheduled release is now live!')}
}

function addContent(f){ /* addCartoon / addMovie / editContent share one saver */
  const o=Object.fromEntries(f),g=f.getAll('genre');
  let i=A.id&&find(A.id);const isNew=!i;
  if(isNew){i={id:uid(),type:o.type==='movie'?'movie':'cartoon',created:Date.now(),ratings:[0,0,0,0,0],seasons:[],dl:[]};db.items.push(i)}
  Object.assign(i,{title:o.title.trim(),poster:(o.poster||'').trim(),backdrop:(o.backdrop||'').trim(),desc:o.desc||'',year:+o.year||new Date().getFullYear(),lang:o.lang,genre:g.length?g:['Other'],chars:o.chars||'',status:o.status||i.status||'Ongoing',runtime:o.runtime||'',release:o.release?new Date(o.release).toISOString():'',featured:!!o.featured,trending:!!o.trending});
  saveDatabase();renderHome();A.id=i.id;toast(isNew?'Added. It is now live on the website.':'Saved');adminRender();
}

function addEpisode(f){
  const i=find(A.id),s=i.seasons.find(x=>x.id===f.get('sid'));if(!s)return toast('Add a season first');
  const o={n:+f.get('n')||s.eps.length+1,title:f.get('title').trim(),desc:f.get('desc')||'',q:f.get('q'),size:f.get('size')||'—',url:f.get('url').trim()},eid=f.get('eid');
  if(eid){const os=i.seasons.find(x=>x.id===f.get('osid'))||s,k=os.eps.findIndex(x=>x.id===eid);if(k>-1){const e=os.eps.splice(k,1)[0];Object.assign(e,o);s.eps.push(e)}}
  else s.eps.push(Object.assign({id:uid()},o));
  s.eps.sort((a,b)=>a.n-b.n);A.ep=null;saveDatabase();renderHome();adminRender();toast('Episode saved');
}

function deleteContent(id){const i=find(id);if(!i||!confirm('Delete "'+i.title+'"? This cannot be undone.'))return;db.items=db.items.filter(x=>x.id!==id);ls.del('ratingGiven_'+id);saveDatabase();renderHome();adminRender();toast('Deleted')}

function importData(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.items))throw 0;if(!confirm('Replace ALL current data with this backup?'))return;db=norm(d);saveDatabase();renderHome();adminRender();toast('Data restored')}catch(e){toast('Invalid backup file')}};
  r.onerror=()=>toast('Could not read file');r.readAsText(file);
}

[3,'By status',()=>dist('Titles by status',i=>i.status||'—')],
[3,'Top rated',()=>rank('Top rated',db.items.filter(tot).sort((a,b)=>calculateAverageRating(b)-calculateAverageRating(a)))],
[3,'Lowest rated',()=>rank('Lowest rated',db.items.filter(tot).sort((a,b)=>calculateAverageRating(a)-calculateAverageRating(b)))],
[3,'Most rated',()=>rank('Most rated',db.items.slice().sort((a,b)=>tot(b)-tot(a)))],
[3,'Added last 7 days',()=>chk2('Added in last 7 days',i=>Date.now()-i.created<6048e5)],
[3,'Upcoming releases',()=>chk2('Upcoming releases',isUp)],
[3,'Featured list',()=>chk2('Featured',i=>i.featured)],
[3,'Trending list',()=>chk2('Trending',i=>i.trending)],
[3,'Storage used',()=>out('Storage',[(JSON.stringify(db).length/1024).toFixed(1)+' KB used of about 5000 KB'],1)],
[4,'Export backup',exportData],
[4,'Export data.json (for GitHub)',()=>dlf('data.json',JSON.stringify(pub(),null,1),'application/json')],
[4,'Export titles CSV',()=>dlf('titles.csv','Title,Type,Year,Language,Genres,Rating,Votes\n'+db.items.map(i=>[i.title,i.type,i.year,i.lang,i.genre.join('/'),calculateAverageRating(i).toFixed(1),tot(i)].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')],
[4,'Export links (.txt)',()=>dlf('links.txt',lks().map(l=>l[0]+' | '+l[1]).join('\n'))],
[4,'Copy JSON',()=>cp(JSON.stringify(pub()),'JSON copied')],
[4,'Import backup file',()=>{const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>importData(f.files[0]);f.click()}],
[4,'Reset to demo',()=>ACT.resetDemo()],
[4,'Clear my rating locks',()=>{db.items.forEach(i=>ls.del('ratingGiven_'+i.id));toast('Cleared on this device')}],
[5,'Publish to cloud now',()=>{pushNow()}],
[5,'Pull from cloud now',()=>{syncDown(1)}],
[5,'Test connection',()=>{if(!cloudOn())return out('Cloud',['❌ CLOUD_URL is empty in index.html'],1);cloudGet('site').then(d=>{out('Cloud',['✅ Connected. Titles online: '+(d&&d.items?d.items.length:0)],1);adminRender()}).catch(e=>{out('Cloud',['❌ Failed: '+e],1);adminRender()})}],
[5,'Set cloud secret',()=>{const x=pr('Firebase database secret (stored only in this browser)');if(x!=null){SECRET.set(x.trim());toast('Secret saved on this device')}}],
[5,'Cloud status',()=>out('Cloud status',['URL: '+esc(cloudOn()?CLOUD_URL:'not set (using data.json)'),'Secret on this device: '+(SECRET.get()?'yes':'no')],1)],
[5,'Clear all votes (cloud)',()=>{if(confirm('Delete ALL visitor votes in the cloud?')){cloudDel('votes');toast('Votes cleared')}}],
[6,'Toggle announcement',()=>{db.ann.on=!db.ann.on;done('Updated')}],
[6,'Set announcement',()=>{const t=pr('Announcement text',db.ann.text);if(t!=null){db.ann={text:t.trim(),on:!!t.trim()};done('Saved')}}],
[6,'Set site name',ask('name','Website name')],
[6,'Set logo URL',ask('logo','Logo URL (https)')],
[6,'Set hero banner URL',ask('hero','Hero banner URL (https)')],
[6,'Set contact',ask('contact','Contact information')],
[6,'Set copyright text',ask('copy','Copyright text')],
[6,'Set accent colors',()=>{const a=pr('Color 1 (hex)','#8b5cf6');if(!a)return;const b=pr('Color 2 (hex)','#f43f5e');db.settings.ca=a;db.settings.cb=b||a;done('Colors set')}],
[6,'Reset colors',()=>{db.settings.ca=db.settings.cb='';done('Colors reset')}],
[6,'Preview as visitor',()=>closeAdmin()],
[6,'Copy site link',()=>cp(location.href.split('#')[0],'Link copied')],
[6,'Reload saved data',()=>{db=loadDatabase();renderHome();toast('Reloaded')}],
[6,'Scroll site to top',()=>{closeAdmin();scrollTo({top:0})}]
];
VIEWS.tools=()=>{
  if(!find(A.tt)&&db.items[0])A.tt=db.items[0].id;
  return '<div class="box"><h3>🧰 Admin Tools ('+TL.length+')</h3><label class="w" style="display:grid;gap:5px">🎯 Target title (used by Per-title tools)<select id="tt">'+db.items.map(i=>'<option value="'+i.id+'" '+(i.id===A.tt?'selected':'')+'>'+esc(i.title)+'</option>').join('')+'</select></label>'
  +'<label style="display:grid;gap:5px;margin-top:10px" class="m">Paste box — episodes: <b>title|MediaFire URL</b> per line · downloads: <b>quality|size|URL</b> per line<textarea id="bulk" rows="4">'+esc(A.bulk||'')+'</textarea></label></div>'
  +'<div class="box" id="tout" '+(A.out?'':'hidden')+'>'+(A.out||'')+'</div>'
  +TG.map((g,gi)=>'<div class="box"><h3>'+g+'</h3><div class="acts" style="margin:0">'+TL.map((t,k)=>t[0]===gi?'<button class="btn g sm" data-act="tool" data-v="'+k+'">'+t[1]+'</button>':'').join('')+'</div></div>').join('');
};
ACT.tool=v=>{A.out='';try{TL[+v][2]()}catch(e){if(e===0||e===undefined)toast('Pick a target title (and a season for episode tools) first');else{console.error(e);toast('Tool failed')}}adminRender();if(A.out)$('#admin').scrollTo({top:0})};
document.addEventListener('input',e=>{if(e.target.id==='bulk')A.bulk=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='tt')A.tt=e.target.value});

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  if(e.target===$('#modal')||e.target===$('#gate')){e.target.id==='modal'?closeModal():closeGate();return}
  const t=e.target.closest('[data-open],[data-nav],[data-act],[data-dl],[data-dm],[data-rate],[data-genre]');
  if(!t)return;
  if(t.dataset.act||t.dataset.nav)e.preventDefault();
  const d=t.dataset;
  if(d.open)openItem(d.open);
  else if(d.nav)nav(d.nav);
  else if(d.act){const f=ACT[d.act];f&&f(d.v,t)}
  else if(d.dl)downloadEpisode(d.dl);
  else if(d.dm)downloadMovie(d.dm);
  else if(d.rate)submitRating(+d.rate);
  else if(d.genre){F.genre=d.genre;F.type='';F.q='';renderHome();document.getElementById('browse').scrollIntoView({behavior:'smooth'})}
});
document.addEventListener('submit',e=>{const k=e.target.dataset.form;if(!k)return;e.preventDefault();try{FORMS[k](new FormData(e.target))}catch(err){console.error(err);toast('Something went wrong. Please check the fields.')}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){F[k]=e.target.value;performSearch()}});
document.addEventListener('change',e=>{
  if(e.target.name==='type'&&e.target.form)e.target.form.classList.toggle('ismov',e.target.value==='movie');
  if(e.target.id==='imp'){importData(e.target.files[0]);e.target.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#gate').hidden)closeGate();else if(!$('#admin').hidden)closeAdmin();else if(!$('#modal').hidden)closeModal()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();e.target.click()}
});
document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&!t.dataset.f){t.dataset.f=1;t.src=ph(t.alt.replace(/ poster$/,'')||'Anime')}},true);
$('#burger').addEventListener('click',()=>{const o=$('#links').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)});

/* ================= START ================= */
db=loadDatabase();
renderHome();
setInterval(tick,1000);
const hideLoader=()=>$('#loader').classList.add('off');
Promise.race([syncDown(),new Promise(r=>setTimeout(r,4000))]).then(()=>setTimeout(hideLoader,250));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#admin').hidden&&$('#modal').hidden)syncDown()});
</script>
</body>
</html>
